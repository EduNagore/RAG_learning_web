[project]
name = "rag-learning-web-labs"
version = "0.0.1"
description = "Tests de los laboratorios de Python (misma versión menor que Pyodide)"
requires-python = ">=3.14,<3.15"
dependencies = ["numpy"]

[dependency-groups]
dev = ["pytest", "ruff"]

[tool.pytest.ini_options]
testpaths = ["tests/labs"]
pythonpath = ["public/py"]

[tool.ruff]
line-length = 100
target-version = "py314"
extend-exclude = ["src/content/labs/*/starter.py"]
