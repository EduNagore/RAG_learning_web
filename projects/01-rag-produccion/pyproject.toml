[project]
name = "rag-produccion"
version = "0.1.0"
description = "Proyecto 1: RAG de producción sobre documentación (ingesta con Docling, Qdrant, búsqueda híbrida, citas y evaluación)."
requires-python = ">=3.10"
# Versiones mínimas comprobadas en PyPI el 2026-10-06; fíjalas con `uv lock` y revisa sus notas de versión.
dependencies = [
  "docling>=2.134",
  "qdrant-client>=1.19",
  "sentence-transformers>=6.1",
  "rank-bm25>=0.2.2",
  "anthropic>=1.11",
  "python-dotenv>=1.2",
]

[project.optional-dependencies]
# Extensiones del proyecto: comprueba su API vigente en la documentación antes de usarlas.
eval = ["ragas>=0.4"]
tracing = ["langfuse>=4"]
